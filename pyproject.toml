[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentporter"
version = "0.1.0.dev0"
description = "A secure, local-first MCP gateway for workspace-scoped code execution, Git inspection, artifacts, and AI agent delegation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgentPorter Contributors" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Security",
]
dependencies = [
    "mcp>=2.2.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
agentporter = "agentporter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentporter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
