# AgentPorter Server Configuration Example
# Copy to ~/.config/agentporter/config.yaml and customize locally.

server:
  host: "127.0.0.1"
  port: 8765
  name: "AgentPorter"

security:
  auth: "api_key"
  header_name: "X-AgentPorter-Key"
  # Client-specific compatibility headers are opt-in, for example:
  # legacy_header_name: "X-Your-Existing-Header"
  allowed_hosts:
    - "127.0.0.1"
    - "127.0.0.1:*"
    - "localhost"
    - "localhost:*"
  # When you intentionally expose AgentPorter through a tunnel, add only the
  # specific tunnel hostname you control instead of a broad wildcard.
  rate_limit:
    max_requests: 120
    window_seconds: 60.0
  max_payload_bytes: 10485760

sandbox:
  backend: "bubblewrap"
  network: false
  default_timeout_seconds: 30
  max_timeout_seconds: 900
  max_output_bytes: 102400
  max_job_log_bytes: 10485760

# Optional host-side SciNet broker. The broker socket is not an SSH socket;
# it is a same-user RPC endpoint owned by agentporter-scinet-broker.service.
# Do not put credentials or ~/.ssh paths in this package example.
scinet:
  # Configure a human identity and a separately managed offline Ed25519 public key.
  # The private signing key must never be stored on this host or in this repository.
  # inference_approval_reviewer: "reviewer@example.org"
  # Public key is installed by root at /etc/agentporter/laya-inference-approval.pub
  host: "trillium-gpu.alliancecan.ca"
  user: "yeli"
  machine: "asgard"
  broker_socket: "/run/user/1000/agentporter/scinet.sock"
  # Full Experiment A/B submission stays off unless a human enables it here.
  # training_allow_full_runs: false
  # training_full_walltime: "02:00:00"

# Optional keyless web_search/web_fetch for Jax, Liz, Prof, Phil, and Wei.
parallel_search:
  enabled: false
