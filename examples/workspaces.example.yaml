# AgentPorter Workspace Registration Example
# Copy to ~/.config/agentporter/workspaces.yaml and use local paths.

workspaces:
  demo-project:
    path: /home/user/projects/demo
    writable: true
    description: "Primary development project"
    allow_execute: true
    allow_git: true
    allow_artifacts: true
    allow_agent_dispatch: false
    # Host-side loopback HTTP is disabled unless exact ports are listed.
    local_http_ports: []

  docs-site:
    path: /home/user/projects/docs
    writable: false
    description: "Read-only documentation repository"
    allow_execute: false
    allow_git: true
    allow_artifacts: false
    allow_agent_dispatch: false
    local_http_ports: []
